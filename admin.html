<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#f5efe4"/>
  <title>Pack &amp; Ship — Minicuration</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="stylesheet" href="/css/theme.css"/>
  <link rel="stylesheet" href="/css/base.css"/>
  <style>
    .admin{max-width:840px;margin:0 auto;padding:60px 24px 100px;}
    .admin h1{font-family:'Cormorant Garamond',serif;font-size:clamp(30px,4vw,46px);font-weight:300;margin-bottom:8px;}
    .admin .lede{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:32px;max-width:60ch;}
    .admin label{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
    .admin input{padding:11px 14px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;border-radius:2px;}
    .admin input:focus{border-color:var(--crimson);}
    .admin button{padding:11px 20px;background:var(--accent);color:var(--on-accent);border:none;font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:.13em;text-transform:uppercase;cursor:pointer;border-radius:2px;}
    .admin button:hover{background:var(--accent-strong);}
    .admin button[disabled]{opacity:50%;cursor:not-allowed;}
    .token-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:28px;}
    .order{border:1px solid var(--border);border-radius:6px;padding:18px 20px;margin-bottom:14px;}
    .order-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
    .order-num{font-size:12px;letter-spacing:.12em;color:var(--crimson);}
    .order h3{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:400;margin-bottom:4px;}
    .order .meta{font-size:13px;color:var(--muted);margin-bottom:14px;}
    .ship-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
    .ship-row input{width:110px;}
    .hint{font-size:12px;color:var(--muted);margin-top:10px;}
    .status{padding:12px 16px;border-radius:4px;font-size:13px;margin-bottom:20px;}
    .status.err{border:1px solid var(--crimson);color:var(--crimson);}
    .status.ok{border:1px solid var(--border);color:var(--muted);}
    .empty{color:var(--muted);font-size:14px;padding:30px 0;}
  </style>
</head>
<body>
  <main class="admin">
    <h1>Pack &amp; ship</h1>
    <p class="lede">
      Enter the edition number actually written on the print you are packing.
      That number — not the stock counter — is what the buyer is told, and the
      email goes out the moment you save it. Each order can only be shipped once.
    </p>

    <div class="token-row">
      <div>
        <label for="token">Admin token</label>
        <input id="token" type="password" autocomplete="current-password"/>
      </div>
      <button id="load" type="button">Load orders</button>
    </div>

    <div id="status" hidden></div>
    <div id="orders"></div>
  </main>

  <script>
  (function () {
    const tokenInput = document.getElementById('token')
    const statusEl   = document.getElementById('status')
    const ordersEl   = document.getElementById('orders')
    const STORAGE    = 'mc_admin_token'

    const saved = localStorage.getItem(STORAGE)
    if (saved) tokenInput.value = saved

    function say(msg, kind) {
      statusEl.hidden = false
      statusEl.className = 'status ' + (kind || 'ok')
      statusEl.textContent = msg
    }

    function request(method, body) {
      const token = tokenInput.value.trim()
      if (!token) { say('Enter the admin token first.', 'err'); return Promise.reject() }
      localStorage.setItem(STORAGE, token)
      return fetch('/api/ship', {
        method: method,
        headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
        body: body ? JSON.stringify(body) : undefined,
      }).then(function (r) {
        return r.json().catch(function () { return {} }).then(function (data) {
          if (!r.ok) {
            const msg = r.status === 401 ? 'Token rejected.'
            : (data.detail || data.error || ('Request failed (' + r.status + ')'))
            throw new Error(msg)
          }
          return data
        })
      })
    }

    function render(pending, editionSize) {
      ordersEl.innerHTML = ''
      if (!pending.length) {
        ordersEl.innerHTML = '<p class="empty">Nothing waiting to be packed.</p>'
        return
      }
      pending.forEach(function (o) {
        const card = document.createElement('div')
        card.className = 'order'

        const ordered = o.created_at ? new Date(o.created_at).toLocaleDateString() : ''
        card.innerHTML =
          '<div class="order-head"><span class="order-num">' + o.order_number + '</span>' +
          '<span class="order-num">' + ordered + '</span></div>' +
          '<h3></h3><p class="meta"></p>' +
          '<div class="ship-row">' +
          '<div><label>Edition number</label>' +
          '<input type="number" min="1" max="' + editionSize + '" step="1"/></div>' +
          '<button type="button">Mark shipped &amp; email buyer</button></div>' +
          '<p class="hint">Counter suggests ' + o.edition_number + ' — change it if the ' +
          'print in your hand says otherwise.</p>'

        // textContent for buyer-supplied values so a name can't inject markup
        card.querySelector('h3').textContent = o.productName
        card.querySelector('.meta').textContent =
          (o.buyer_name || 'Unknown buyer') + ' · ' + (o.buyer_email || 'no email')

        const input = card.querySelector('input')
        const btn   = card.querySelector('button')
        input.value = o.edition_number || ''

        btn.addEventListener('click', function () {
          const n = Number(input.value)
          if (!Number.isInteger(n) || n < 1 || n > editionSize) {
            say('Edition number must be a whole number from 1 to ' + editionSize + '.', 'err')
            return
          }
          btn.disabled = true
          request('POST', { id: o.id, editionNumber: n }).then(function (data) {
            say('Sent ' + data.shipped.order_number + ' — edition ' + data.shipped.edition_number +
                (data.emailed ? '. Buyer emailed.' : '. NOTE: email did not send, check Resend.'), 'ok')
            load()
          }).catch(function (err) {
            btn.disabled = false
            if (err && err.message) say(err.message, 'err')
          })
        })

        ordersEl.appendChild(card)
      })
    }

    function load() {
      request('GET').then(function (data) {
        render(data.pending || [], data.editionSize || 50)
      }).catch(function (err) {
        if (err && err.message) say(err.message, 'err')
      })
    }

    document.getElementById('load').addEventListener('click', load)
    if (saved) load()
  })()
  </script>
</body>
</html>
